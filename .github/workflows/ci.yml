name: Frontend CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 22 o‘rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bog‘liqliklar (npm ci)
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Production build
        run: npm run build
